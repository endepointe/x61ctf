services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    depends_on:
      - oauth2-proxy
      - app
    ports:
      - "8080:80"         # dev
      # - "443:443"       # prod: terminate TLS here (recommended)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # prod TLS
    networks:
      - edge

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    environment:
      # Provider
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0"
      OAUTH2_PROXY_CLIENT_ID: "${ENTRA_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET}"

      # OIDC scopes
      OAUTH2_PROXY_SCOPE: "openid profile email"

      # Cookie / session
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_SECURE: "false"     # set true behind HTTPS
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_REFRESH: "55m"      # refresh session periodically
      OAUTH2_PROXY_SESSION_STORE_TYPE: "cookie"

      # Reverse proxy mode
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REDIRECT_URL: "http://localhost:8080/oauth2/callback"

      # Authorization policy (tighten)
      # Restrict to a domain if you have one:
      # OAUTH2_PROXY_EMAIL_DOMAINS: "yourcompany.com"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"

      # Send identity context back to NGINX via X-Auth-Request-* headers
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"

      # Useful if your upstream app wants the access token:
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"

      # UX
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"

    command:
      - --standard-logging=true
      - --auth-logging=true
      - --request-logging=true
    networks:
      - edge

  app:
    image: traefik/whoami:v1.10.4
    container_name: protected-app
    networks:
      - edge

networks:
  edge:
    driver: bridge

